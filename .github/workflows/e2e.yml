name: E2E
run-name: E2E ${{ inputs.sdk_ref || inputs.sdk_version || '' }}

# Cucumber scenarios against the test environment (*.pollar.dev). The report is
# on the run page (summary) and in the e2e-report artifact (HTML, JSON, JUnit).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
    inputs:
      sdk_version:
        description: '@pollar/core version or dist-tag to test (default: latest)'
        required: false
      sdk_ref:
        description: 'Git tag or branch of pollar-xyz/pollar to build @pollar/core from (for example v0.12.0-rc.1). Overrides sdk_version.'
        required: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Test the SDK as published now, not the one pinned in the lockfile.
      # Order: manual input, then the POLLAR_SDK_VERSION repo variable, then latest.
      - name: Install @pollar/core under test
        if: ${{ !inputs.sdk_ref }}
        run: npm install --no-save "@pollar/core@${SDK_VERSION:-latest}"
        env:
          SDK_VERSION: ${{ inputs.sdk_version || vars.POLLAR_SDK_VERSION }}
      # A release candidate: build @pollar/core from the SDK repo at that tag.
      - if: ${{ inputs.sdk_ref }}
        uses: actions/checkout@v4
        with:
          repository: pollar-xyz/pollar
          ref: ${{ inputs.sdk_ref }}
          path: sdk
      - name: Build @pollar/core from ${{ inputs.sdk_ref }}
        if: ${{ inputs.sdk_ref }}
        working-directory: sdk
        run: |
          npm ci
          npm run build -w @pollar/core
          npm pack -w @pollar/core --pack-destination ..
      - if: ${{ inputs.sdk_ref }}
        run: npm install --no-save ./pollar-core-*.tgz
      - run: npm run typecheck
      - run: npm run test:e2e
        env:
          POLLAR_DEV_PAT: ${{ secrets.POLLAR_DEV_PAT }}
          E2E_HUB_URL: ${{ vars.E2E_HUB_URL }}
          E2E_SDK_URL: ${{ vars.E2E_SDK_URL }}
      - if: always()
        run: npm run report:summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/
          if-no-files-found: ignore
